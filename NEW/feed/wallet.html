<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plantoid - Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #34d399;
            --accent-soft: #4ade80;
            --accent-dim: rgba(52, 211, 153, 0.5);
            --hairline: rgba(255, 255, 255, 0.12);
            --text-dim: #9aa3ad;
            --mono: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(1100px 560px at 88% -8%, rgba(52, 211, 153, 0.12), transparent 60%),
                linear-gradient(135deg, rgba(8, 10, 22, 0.92) 0%, rgba(18, 20, 40, 0.92) 50%, rgba(14, 24, 44, 0.92) 100%),
                url('../assets/header2.png') no-repeat top right fixed,
                #05060d;
            color: #ffffff;
            font-family: 'Lato', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Slow drifting aurora glow behind the content */
        body::before {
            content: '';
            position: fixed;
            inset: -20%;
            z-index: -2;
            background:
                radial-gradient(38% 38% at 18% 28%, rgba(52, 211, 153, 0.12), transparent 70%),
                radial-gradient(34% 34% at 82% 72%, rgba(86, 124, 255, 0.10), transparent 70%);
            filter: blur(30px);
            animation: aurora 26s ease-in-out infinite alternate;
        }

        @keyframes aurora {
            0%   { transform: translate3d(-3%, -2%, 0) scale(1); }
            100% { transform: translate3d(3%, 2%, 0) scale(1.12); }
        }

        .background-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .header { text-align: center; margin-bottom: 1.25rem; margin-top: 0.5rem; }

        .title {
            font-family: 'Lato', sans-serif;
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
            margin-bottom: 0.4rem;
            background: linear-gradient(180deg, #ffffff 0%, #d4efe4 55%, #8fd9bd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(52, 211, 153, 0.12);
        }

        .subtitle { font-size: 0.82rem; color: var(--text-dim); font-weight: 300; letter-spacing: 0.2em; }

        .plantoid-card {
            position: relative;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--hairline);
            border-radius: 22px;
            padding: 1.5rem;
            backdrop-filter: blur(14px);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.3fr);
            gap: 1.5rem;
            align-items: stretch;
        }

        /* Gradient hairline border that fades from accent → transparent */
        .plantoid-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(145deg, rgba(52, 211, 153, 0.45), rgba(255, 255, 255, 0.06) 42%, transparent 72%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .col { display: flex; flex-direction: column; min-width: 0; }

        .plantoid-image {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 400px;
            background: center/cover no-repeat;
            border-radius: 16px;
            border: 1px solid var(--hairline);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            overflow: hidden;
        }

        .plantoid-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.45));
            pointer-events: none;
        }

        .plantoid-image:hover {
            transform: scale(1.02);
            box-shadow: 0 16px 44px rgba(52, 211, 153, 0.25);
        }

        .plantoid-stats { margin-bottom: 0.75rem; }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.75rem;
            padding: 0.6rem 0;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-item:last-child { border-bottom: none; }

        .stat-label {
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.62rem;
            letter-spacing: 0.12em;
        }

        .stat-value {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.8rem;
            text-align: right;
            word-break: break-all;
            font-family: var(--mono);
        }

        .wallet-section {
            margin-top: 0.6rem;
            padding: 0.2rem 0;
            background: transparent;
            border: none;
        }

        .wallet-address {
            text-align: center;
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.38);
            word-break: break-all;
            font-weight: 400;
            font-family: var(--mono);
            letter-spacing: 0.02em;
        }

        .feed-area {
            margin-top: auto;
            margin-bottom: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .cooldown-wrapper { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .cooldown-wrapper.hidden { display: none; }

        .cooldown-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-weight: 600;
        }

        .cooldown-circle {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cooldown-circle svg { width: 100%; height: 100%; }
        .cooldown-progress-track { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 6; }
        .cooldown-progress-bar {
            fill: none;
            stroke: var(--accent);
            stroke-width: 6;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.25s linear;
            filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.5));
        }

        .cooldown-time {
            position: absolute;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
            font-family: var(--mono);
        }

        .feed-button {
            width: 100%;
            padding: 1.4rem 1rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            animation: pulse 3.5s ease-in-out infinite;
        }

        .feed-button::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease-out, height 0.6s ease-out;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 255, 255, 0.08); }
            50% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 32px rgba(255, 255, 255, 0.18); }
        }

        .feed-button:hover::before { width: 420px; height: 420px; }
        .feed-button:hover { transform: translateY(-4px); box-shadow: 0 16px 44px rgba(255, 255, 255, 0.18); }
        .feed-button:active { transform: translateY(-2px); }
        .feed-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; }
        .feed-button span { position: relative; z-index: 1; }

        .info-box {
            padding: 1.4rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-radius: 16px;
            border: 1px solid var(--hairline);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .info-title {
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.85rem;
            padding-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            text-align: center;
            border-bottom: 1px solid var(--hairline);
        }

        .description-text {
            font-size: 0.8rem;
            color: #d7dde3;
            line-height: 1.65;
            white-space: pre-wrap;
            flex: 1;
        }

        .info-link {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.6rem 1.2rem;
            font-size: 0.8rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            align-self: center;
        }

        .info-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Non-clickable informational caption: strip the button chrome */
        .info-link-static {
            pointer-events: none;
            cursor: default;
            background: transparent;
            border: none;
            box-shadow: none;
            color: var(--text-dim);
            text-transform: none;
            font-weight: 400;
            letter-spacing: 0.06em;
            padding: 0.6rem 0 0;
        }

        .loading { opacity: 0.6; pointer-events: none; }

        .seeds-gallery {
            grid-column: 1 / -1;
            margin-top: 0.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--hairline);
        }

        .seeds-gallery-title {
            font-family: 'Lato', sans-serif;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 1.3rem;
            background: linear-gradient(90deg, #ffffff, #8fd9bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .seeds-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .seed-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .seed-card:hover {
            border-color: var(--accent-dim);
            box-shadow: 0 12px 30px rgba(52, 211, 153, 0.28);
            transform: translateY(-4px);
        }

        .seed-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .seed-card:hover video { transform: scale(1.07); }

        .seed-card-label {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 0.5rem 0.6rem;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: #fff;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
            text-align: center;
        }

        .seeds-gallery-status {
            text-align: center;
            color: #a0a0a0;
            font-size: 0.85rem;
            padding: 1rem;
        }

        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .video-modal.active { display: flex; }
        .video-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
        }
        .video-modal-content {
            position: relative;
            z-index: 1;
            max-width: 92vw;
            max-height: 92vh;
            display: flex;
        }
        #video-modal-player {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            background: #000;
        }
        .video-modal-close {
            position: absolute;
            top: -2.6rem;
            right: 0;
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .video-modal-close:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 900px) {
            .plantoid-card { grid-template-columns: 1fr; }
            .seeds-gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js" type="application/javascript"></script>

    <div class="container">
        <header class="header">
            <h1 class="title" id="plantoid-title">PLANTOID</h1>
            <p class="subtitle" id="plantoid-subtitle"></p>
        </header>

        <div class="plantoid-card">
            <div class="col col-image">
                <div class="plantoid-image" id="plantoid-image"></div>
            </div>

            <div class="col col-stats">
                <div class="plantoid-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Seeds in Circulation:</span>
                        <span class="stat-value" id="total-seeds">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Seeds Owned by You:</span>
                        <span class="stat-value" id="your-seeds">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Smart Contract:</span>
                        <span class="stat-value" id="contract-address">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Current Balance:</span>
                        <span class="stat-value" id="balance">--</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Required Threshold:</span>
                        <span class="stat-value">5.0 ETH</span>
                    </div>
                </div>

                <div class="feed-area">
                    <div class="cooldown-wrapper hidden" id="cooldown-wrapper">
                        <div class="cooldown-label">Wait till next feed</div>
                        <div class="cooldown-circle">
                            <svg viewBox="0 0 120 120">
                                <circle class="cooldown-progress-track" cx="60" cy="60" r="54"></circle>
                                <circle class="cooldown-progress-bar" id="cooldown-progress" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="0"></circle>
                            </svg>
                            <div class="cooldown-time" id="cooldown-time">30:00</div>
                        </div>
                    </div>
                    <button class="feed-button" id="feed-btn" disabled>
                        <span>Feed Plantoid</span>
                    </button>
                </div>

                <div class="wallet-section">
                    <div class="wallet-address" id="wallet-address">Initializing...</div>
                </div>
            </div>

            <div class="col col-info">
                <div class="info-box">
                    <div class="info-title">What is a Plantoid?</div>
                    <div class="description-text" id="description-text"></div>
                    <span class="info-link info-link-static">Learn more at plantoid.org</span>
                </div>
            </div>

            <section class="seeds-gallery" id="seeds-gallery">
                <h2 class="seeds-gallery-title">Explore Recent Seeds</h2>
                <div class="seeds-gallery-status" id="seeds-gallery-status">Loading revealed seeds…</div>
                <div class="seeds-gallery-grid" id="seeds-gallery-grid"></div>
            </section>
        </div>
    </div>

    <div class="video-modal" id="video-modal">
        <div class="video-modal-backdrop"></div>
        <div class="video-modal-content">
            <button class="video-modal-close" id="video-modal-close" aria-label="Close">×</button>
            <video id="video-modal-player" controls loop playsinline></video>
        </div>
    </div>

    <script type="module">
        import { resolvePlantoid, getNetworks, getRegistry } from "../modules/plantoid-resolver.js";

        const FUNNY = "0x61c5ed909c63d9348bee0f3e29f8d0c12673e4ce37dca43896a1537c81437730";
        const COOLDOWN_MS = 60 * 60 * 1000;
        const CIRCUMFERENCE = 2 * Math.PI * 54;

        const ABI = [
            "function totalSupply() view returns (uint256)",
            "function balanceOf(address owner) view returns (uint256)",
            "function artist() view returns (address)",
            "event FundReceived(address indexed donor, uint256 amount)"
        ];

        let plantoid = null;
        let network = null;
        let contractAddress = null;
        let provider = null;
        let signer = null;
        let contract = null;
        let userAddress = null;
        let cooldownInterval = null;
        let cooldownKey = null;

        async function bootstrap() {
            plantoid = await resolvePlantoid();
            const networks = await getNetworks();
            const registry = await getRegistry();

            network = networks.sepolia;
            contractAddress = plantoid.contracts.sepolia;
            cooldownKey = `plantoid_cooldown_${contractAddress.toLowerCase()}`;

            document.title = `${plantoid.name} - Wallet`;
            document.getElementById("plantoid-title").textContent = plantoid.name;
            document.getElementById("plantoid-subtitle").textContent = plantoid.subtitle;
            document.getElementById("plantoid-image").style.backgroundImage = `url('../${plantoid.image}')`;
            document.getElementById("description-text").textContent = registry.shared.description.main;
            document.getElementById("contract-address").textContent = `${contractAddress.slice(0, 6)}...${contractAddress.slice(-4)}`;

            await initializeWithPrivateKey();
            restoreCooldown();
            loadRevealedSeedsGallery();
        }

        async function loadStats() {
            try {
                if (!contract || !provider) return;

                const balanceWei = await provider.getBalance(contractAddress);
                document.getElementById("balance").textContent = `${ethers.formatEther(balanceWei)} ETH`;

                try {
                    const totalSupply = await contract.totalSupply();
                    document.getElementById("total-seeds").textContent = totalSupply.toString();
                } catch {
                    document.getElementById("total-seeds").textContent = "N/A";
                }

                if (userAddress) {
                    try {
                        const userSeeds = await contract.balanceOf(userAddress);
                        document.getElementById("your-seeds").textContent = userSeeds.toString();
                    } catch {
                        document.getElementById("your-seeds").textContent = "N/A";
                    }
                } else {
                    document.getElementById("your-seeds").textContent = "--";
                }
            } catch (error) {
                console.error("Failed to load stats:", error);
            }
        }

        async function initializeWithPrivateKey() {
            const feedBtn = document.getElementById("feed-btn");
            const addressDiv = document.getElementById("wallet-address");

            try {
                addressDiv.textContent = "Connecting...";
                if (!FUNNY) throw new Error("FUNNY not configured.");

                provider = new ethers.JsonRpcProvider(network.rpcUrl);
                signer = new ethers.Wallet(FUNNY, provider);
                userAddress = await signer.getAddress();
                contract = new ethers.Contract(contractAddress, ABI, signer);

                addressDiv.textContent = `Connected: ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
                feedBtn.disabled = false;

                await loadStats();
                console.log("✓ Connected with address:", userAddress);
            } catch (error) {
                console.error("Failed to initialize:", error);
                addressDiv.textContent = "✗ Failed to connect";
                alert(`Failed to initialize wallet.\n\nError: ${error.message}`);
            }
        }

        async function feedPlantoid() {
            const btn = document.getElementById("feed-btn");

            try {
                btn.innerHTML = "<span>Feeding...</span>";
                btn.disabled = true;
                btn.classList.add("loading");

                const tx = await signer.sendTransaction({
                    to: contractAddress,
                    value: ethers.parseEther(network.feedAmount)
                });

                console.log("Transaction sent:", tx.hash);
                btn.innerHTML = "<span>Confirming...</span>";

                await tx.wait();
                console.log("Transaction confirmed");

                btn.innerHTML = "<span>✓ Fed!</span>";
                btn.style.background = "linear-gradient(45deg, #16a085, #27ae60)";

                await loadStats();

                setTimeout(() => {
                    btn.innerHTML = "<span>Feed Plantoid</span>";
                    btn.style.background = "";
                    btn.classList.remove("loading");
                    startCooldown();
                    // Refresh just the seeds gallery (not the whole page) so any
                    // newly revealed seed shows up without disrupting the cooldown.
                    loadRevealedSeedsGallery();
                }, 3000);
            } catch (error) {
                console.error("Failed to feed:", error);
                alert(`Transaction failed.\n\nError: ${error.message}`);
                btn.innerHTML = "<span>Feed Plantoid</span>";
                btn.style.background = "";
                btn.disabled = false;
                btn.classList.remove("loading");
            }
        }

        function startCooldown() {
            const endTime = Date.now() + COOLDOWN_MS;
            try { localStorage.setItem(cooldownKey, endTime.toString()); } catch {}
            runCooldown(endTime);
        }

        function runCooldown(endTime) {
            const circle = document.getElementById("cooldown-wrapper");
            const btn = document.getElementById("feed-btn");
            const progress = document.getElementById("cooldown-progress");
            const timeEl = document.getElementById("cooldown-time");

            circle.classList.remove("hidden");
            btn.disabled = true;

            if (cooldownInterval) clearInterval(cooldownInterval);

            const tick = () => {
                const remaining = Math.max(0, endTime - Date.now());
                const fraction = remaining / COOLDOWN_MS;
                progress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);

                const totalSeconds = Math.ceil(remaining / 1000);
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                timeEl.textContent = `${m}:${s.toString().padStart(2, "0")}`;

                if (remaining <= 0) {
                    clearInterval(cooldownInterval);
                    cooldownInterval = null;
                    circle.classList.add("hidden");
                    btn.disabled = false;
                    try { localStorage.removeItem(cooldownKey); } catch {}
                }
            };
            tick();
            cooldownInterval = setInterval(tick, 250);
        }

        function restoreCooldown() {
            try {
                const stored = localStorage.getItem(cooldownKey);
                if (!stored) return;
                const endTime = parseInt(stored, 10);
                if (endTime > Date.now()) runCooldown(endTime);
                else localStorage.removeItem(cooldownKey);
            } catch {}
        }

        // ---- Revealed seeds gallery + video modal ----
        const INDEXER_GRAPHQL_URL = "https://plantoidz-brainz.tail98279f.ts.net/graphql";
        const SUBGRAPH_URL_SEPOLIA = "https://api.studio.thegraph.com/query/68539/plantoid-sep/3";

        function ipfsToHttp(url) {
            if (!url) return "";
            return url.startsWith("ipfs://")
                ? "https://ipfs.io/ipfs/" + url.replace("ipfs://", "")
                : url;
        }

        async function ponderFetchRevealed(plantoidAddress) {
            const query = `
              query GetSeeds($plantoidId: String!) {
                seeds(where: { plantoidId: $plantoidId, revealed: true }, limit: 1000) {
                  items { id tokenId revealed uri }
                }
              }`;
            const res = await fetch(INDEXER_GRAPHQL_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query, variables: { plantoidId: plantoidAddress.toLowerCase() } })
            });
            if (!res.ok) throw new Error(`Indexer HTTP ${res.status}`);
            const r = await res.json();
            if (r.errors) throw new Error("Indexer GraphQL error");
            return r.data?.seeds?.items || [];
        }

        async function subgraphFetchRevealed(plantoidAddress) {
            const query = `
              query GetRevealedSeeds($plantoidId: String!) {
                plantoidInstance(id: $plantoidId) {
                  seeds(first: 1000, where: { revealed: true }) {
                    id tokenId uri revealed
                  }
                }
              }`;
            const res = await fetch(SUBGRAPH_URL_SEPOLIA, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query, variables: { plantoidId: plantoidAddress.toLowerCase() } })
            });
            if (!res.ok) throw new Error(`Subgraph HTTP ${res.status}`);
            const r = await res.json();
            if (r.errors) throw new Error("Subgraph GraphQL error");
            return r.data?.plantoidInstance?.seeds || [];
        }

        async function fetchRevealedSeeds(plantoidAddress) {
            try {
                return await ponderFetchRevealed(plantoidAddress);
            } catch (e) {
                console.warn("Ponder unavailable, trying subgraph:", e.message);
                try {
                    return await subgraphFetchRevealed(plantoidAddress);
                } catch (e2) {
                    console.error("Subgraph also failed:", e2.message);
                    return [];
                }
            }
        }

        async function fetchSeedMetadata(seed) {
            if (!seed.uri) return null;
            const res = await fetch(ipfsToHttp(seed.uri));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // Only play videos that are on-screen; pause the rest to keep big grids smooth.
        const seedObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                const v = entry.target.querySelector("video");
                if (!v) return;
                if (entry.isIntersecting) v.play().catch(() => {});
                else v.pause();
            });
        }, { rootMargin: "150px" });

        const modal = document.getElementById("video-modal");
        const modalPlayer = document.getElementById("video-modal-player");

        function openVideoModal(animationUrl, posterUrl) {
            modalPlayer.src = animationUrl;
            if (posterUrl) modalPlayer.poster = posterUrl;
            // Sound on by default — allowed because this runs inside a click handler.
            modalPlayer.muted = false;
            modalPlayer.volume = 1.0;
            modal.classList.add("active");
            const p = modalPlayer.play();
            if (p && p.catch) p.catch(err => console.warn("Playback blocked:", err));
        }

        function closeVideoModal() {
            modalPlayer.pause();
            modal.classList.remove("active");
            modalPlayer.removeAttribute("src");
            modalPlayer.load();
        }

        document.getElementById("video-modal-close").addEventListener("click", closeVideoModal);
        modal.querySelector(".video-modal-backdrop").addEventListener("click", closeVideoModal);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("active")) closeVideoModal();
        });

        const MAX_SEEDS = 5;

        async function loadRevealedSeedsGallery() {
            const grid = document.getElementById("seeds-gallery-grid");
            const status = document.getElementById("seeds-gallery-status");
            status.style.display = "block";
            try {
                const seeds = await fetchRevealedSeeds(contractAddress);
                if (!seeds.length) {
                    seedObserver.disconnect();
                    grid.innerHTML = "";
                    status.textContent = "No revealed seeds yet.";
                    return;
                }
                // Newest first, capped to the most recent few
                seeds.sort((a, b) => parseInt(b.tokenId) - parseInt(a.tokenId));
                const recent = seeds.slice(0, MAX_SEEDS);
                status.textContent = `Loading ${recent.length} seeds…`;

                // Reset previously-observed tiles, then drop ordered placeholders
                // and fill each as its metadata arrives.
                seedObserver.disconnect();
                grid.innerHTML = "";
                const cards = new Map();
                recent.forEach((seed) => {
                    const card = document.createElement("div");
                    card.className = "seed-card";
                    card.title = `Seed #${seed.tokenId}`;
                    card.innerHTML = `<div class="seed-card-label">Seed #${seed.tokenId}</div>`;
                    grid.appendChild(card);
                    cards.set(seed.id, card);
                });

                let rendered = 0;
                await Promise.all(recent.map(async (seed) => {
                    const card = cards.get(seed.id);
                    try {
                        const m = await fetchSeedMetadata(seed);
                        const animation = ipfsToHttp(m?.animation_url);
                        const image = ipfsToHttp(m?.image);
                        if (!animation) { card.remove(); return; }
                        const poster = image ? ` poster="${image}"` : "";
                        card.insertAdjacentHTML("afterbegin",
                            `<video src="${animation}"${poster} muted loop playsinline preload="metadata"></video>`);
                        card.addEventListener("click", () => openVideoModal(animation, image));
                        seedObserver.observe(card);
                        rendered++;
                    } catch (e) {
                        console.error(`Seed ${seed.tokenId} metadata failed:`, e);
                        card.remove();
                    }
                }));

                if (rendered === 0) {
                    status.textContent = "No revealed seeds with video yet.";
                } else {
                    status.style.display = "none";
                }
            } catch (e) {
                console.error("Failed to load revealed seeds gallery:", e);
                status.textContent = "Could not load seeds.";
            }
        }

        document.getElementById("feed-btn").addEventListener("click", feedPlantoid);

        window.addEventListener("load", bootstrap);
    </script>
</body>
</html>
